<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>devopslearning</title>
  <!-- Kurz-Link: leitet mit Herkunfts-Parameter auf die Linkseite weiter; zusaetzliche
       Parameter (z. B. ?campaign=proxmox-video) werden durchgereicht -->
  <meta http-equiv="refresh" content="0; url=../?src=tiktok">
  <script>
    location.replace("../?src=tiktok" + (location.search ? "&" + location.search.slice(1) : ""));
  </script>
</head>
<body></body>
</html>
